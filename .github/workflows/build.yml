name: Main Build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout Yoshipi.Samples
      uses: actions/checkout@v4
      with:
        path: Yoshipi.Samples

    - name: Checkout FieldStack
      uses: actions/checkout@v4
      with:
        repository: FieldStackIoT/FieldStack
        path: FieldStack

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build Yoshipi.Samples
      run: dotnet build -c Release Yoshipi.Samples/Source/Yoshipi.Samples.slnx
